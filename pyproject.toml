[build-system]
requires = ["setuptools>=77"]  # license = "MIT" (PEP 639) needs setuptools 77+
build-backend = "setuptools.build_meta"

[project]
name = "valuation-mvp"
version = "0.1.0"
description = "Minimal DCF valuation tool for Vietnamese stocks: deterministic math, LLM-extracted figures with page citations, and a verification journal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nguyễn Đăng Long" }]
dependencies = []

[project.scripts]
valuation = "valuation.cli:main"

[project.urls]
Repository = "https://github.com/Lolavine777/valuation-mvp"

[tool.setuptools]
packages = ["valuation"]
